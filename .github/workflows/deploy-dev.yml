name: Deploy dev on push to main

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      ECS_CPU: 1024
      ECS_MEMORY: 4096
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch all history for accurate tagging
          ref: ${{ github.ref }}  # Use the tag ref for the build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Render config.ttl.dev
        run: |
          BASE="${{ secrets.GRAPHDB_INTERNAL_BASE_DEV }}"
          if [ -z "$BASE" ]; then
            echo "GRAPHDB_INTERNAL_BASE_DEV is not set" >&2
            exit 1
          fi
          BASE="${BASE%/}"
          sed "s|__GRAPHDB_INTERNAL_BASE__|$BASE|g" config.ttl.dev > config.ttl.dev.tmp
          mv config.ttl.dev.tmp config.ttl.dev

      - name: Build Docker image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/mdu-skosmos:dev \
            -f Dockerfile.dev .
    
      - name: Push Docker image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/mdu-skosmos:dev

      - name: Prepare ECS task definition
        run: |
          sed "s|<account_id>|${{ secrets.AWS_ACCOUNT_ID }}|g; s|<cpu>|${{ env.ECS_CPU }}|g; s|<memory>|${{ env.ECS_MEMORY }}|g" ecs/ecs-task-definition.dev.json.template > ecs/ecs-task-definition.json

      - name: Fill in image id in ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ./ecs/ecs-task-definition.json
          container-name: mdu-skosmos-dev
          image: ${{ steps.login-ecr.outputs.registry }}/mdu-skosmos:dev

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          cluster: mdu-skosmos-dev-cluster
          service: mdu-skosmos-dev-task-service
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          wait-for-service-stability: true